# Decap CMS configuration
# Before production use, replace YOUR_VERCEL_DOMAIN below if it changes.

backend:
  name: github
  repo: One-johnson/decap-cms-demo
  branch: main
  base_url: https://decap-cms-demo.vercel.app
  auth_endpoint: api/auth

# Enables local editing without GitHub OAuth when decap-server is running
local_backend: true

media_folder: public/uploads
public_folder: /uploads

collections:
  - name: settings
    label: Site Settings
    files:
      - name: site
        label: Site Settings
        file: content/settings.md
        fields:
          - { label: Brand Name, name: brandName, widget: string }
          - { label: Logo, name: logo, widget: image, required: false, hint: "Shown in the header and footer" }
          - { label: Favicon, name: favicon, widget: image, required: false, hint: "Browser tab icon (square PNG/SVG/ICO works best)" }
          - { label: Footer Blurb, name: footerBlurb, widget: text }
          - { label: Nav CTA Text, name: navCtaText, widget: string }
          - { label: Nav CTA Link, name: navCtaLink, widget: string, hint: "e.g. /services or https://..." }
          - { label: Footer CTA Text, name: footerCtaText, widget: string }
          - { label: Footer CTA Link, name: footerCtaLink, widget: string }

  - name: pages
    label: Pages
    files:
      - name: home
        label: Home
        file: content/home.md
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Hero Heading, name: heroHeading, widget: string }
          - { label: Hero Description, name: heroDescription, widget: text }
          - { label: Primary CTA Text, name: ctaText, widget: string }
          - { label: Primary CTA Link, name: ctaLink, widget: string, hint: "e.g. /services" }
          - { label: Secondary CTA Text, name: secondaryCtaText, widget: string, required: false }
          - { label: Secondary CTA Link, name: secondaryCtaLink, widget: string, required: false }
          - { label: Hero Image, name: heroImage, widget: image, required: false }
          - { label: Body, name: body, widget: markdown }
          - { label: Process Heading, name: processHeading, widget: string, required: false }
          - label: Process Steps
            name: processSteps
            widget: list
            required: false
            summary: "{{fields.title}}"
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Description, name: description, widget: text }
          - { label: Why Choose Us Heading, name: whyChooseUsHeading, widget: string, required: false }
          - label: Why Choose Us
            name: whyChooseUs
            widget: list
            required: false
            summary: "{{fields.title}}"
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Description, name: description, widget: text }
          - { label: CTA Band Heading, name: ctaBandHeading, widget: string, required: false }
          - { label: CTA Band Description, name: ctaBandDescription, widget: text, required: false }
          - { label: CTA Band Button Text, name: ctaBandButtonText, widget: string, required: false }
          - { label: CTA Band Button Link, name: ctaBandButtonLink, widget: string, required: false }

      - name: about
        label: About
        file: content/about.md
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Company Description, name: companyDescription, widget: text }
          - { label: Mission, name: mission, widget: text }
          - { label: Vision, name: vision, widget: text }
          - label: Values
            name: values
            widget: list
            required: false
            summary: "{{fields.title}}"
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Description, name: description, widget: text }
          - { label: Body, name: body, widget: markdown }
          - { label: Compliance Heading, name: complianceHeading, widget: string, required: false }
          - label: Compliance Items
            name: complianceItems
            widget: list
            required: false
            summary: "{{fields.label}}"
            fields:
              - { label: Label, name: label, widget: string }
              - { label: Detail, name: detail, widget: text }
          - { label: Inline CTA Text, name: ctaText, widget: string, required: false }
          - { label: Inline CTA Link, name: ctaLink, widget: string, required: false }
          - { label: CTA Band Heading, name: ctaBandHeading, widget: string, required: false }
          - { label: CTA Band Description, name: ctaBandDescription, widget: text, required: false }
          - { label: CTA Band Button Text, name: ctaBandButtonText, widget: string, required: false }
          - { label: CTA Band Button Link, name: ctaBandButtonLink, widget: string, required: false }

      - name: services
        label: Services
        file: content/services.md
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Description, name: description, widget: text }
          - label: Service Items
            name: services
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { label: Service Title, name: title, widget: string }
              - { label: Service Description, name: description, widget: text }
              - { label: Image, name: image, widget: image, required: false }
              - { label: CTA Text, name: ctaText, widget: string, required: false }
              - { label: CTA Link, name: ctaLink, widget: string, required: false }
          - { label: Body, name: body, widget: markdown }
          - { label: CTA Band Heading, name: ctaBandHeading, widget: string, required: false }
          - { label: CTA Band Description, name: ctaBandDescription, widget: text, required: false }
          - { label: CTA Band Button Text, name: ctaBandButtonText, widget: string, required: false }
          - { label: CTA Band Button Link, name: ctaBandButtonLink, widget: string, required: false }
